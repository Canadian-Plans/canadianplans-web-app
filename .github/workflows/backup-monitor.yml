name: Backup monitor
on:
  schedule:
    # Hourly is well inside the 26-hour Phase A alert threshold (REQ 44).
    - cron: '8 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: backup-monitor-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  monitor:
    # A third, independent GitHub Environment: the monitor holds only a
    # recovery-reader (list+get) B2 credential, never the daily writer's or
    # the retention administrator's (IMPLEMENTATION_PLAN §13: "A separate
    # monitor alerts when the latest complete verified snapshot exceeds 26
    # hours"). A failed step here fails the workflow run, which notifies the
    # repository's default watchers — GitHub scheduled jobs are not a
    # recovery SLA; the owner reviews and directs the response.
    environment: backup-monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the latest verified backup snapshot age
        env:
          B2_ARCHIVE_ENDPOINT: ${{ secrets.B2_ARCHIVE_ENDPOINT }}
          B2_ARCHIVE_REGION: ${{ secrets.B2_ARCHIVE_REGION }}
          B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
          B2_ARCHIVE_READER_KEY_ID: ${{ secrets.B2_ARCHIVE_READER_KEY_ID }}
          B2_ARCHIVE_READER_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READER_APPLICATION_KEY }}
          OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
          OWNER_ALERT_WEBHOOK_URL: ${{ secrets.OWNER_ALERT_WEBHOOK_URL }}
          OWNER_ALERT_WEBHOOK_SECRET: ${{ secrets.OWNER_ALERT_WEBHOOK_SECRET }}
        run: pnpm --filter @canadian-plans/jobs run monitor
